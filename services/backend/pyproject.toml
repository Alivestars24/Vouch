[project]
name = "vouch-backend"
version = "0.1.0"
description = "Fixture-first API and worker for Vouch's evidence-backed Check workflow"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.156,<0.157",
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0.46,<2.1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.40,<0.41",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
]

[project.scripts]
vouch-api = "vouch_backend.cli:api"
vouch-worker = "vouch_backend.worker:main"
vouch-retention = "vouch_backend.retention:main"
vouch-openapi = "vouch_backend.openapi:main"
vouch-db-schema = "vouch_backend.persistence:print_schema"
vouch-local-setup = "vouch_backend.local_setup:main"
vouch-hosted-setup = "vouch_backend.hosted_setup:main"
vouch-hosted-onboard = "vouch_backend.hosted_onboard:main"
vouch-meta-probe = "vouch_backend.meta_probe:main"
vouch-meta-smoke = "vouch_backend.meta_smoke:main"

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vouch_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
